<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | MGE — Électricien Paris</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="images/logo-mge.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retrouvez les prestations électriques MGE à Paris depuis l'accueil.">
    <meta name="robots" content="noindex, follow">
    <meta property="og:title" content="Page introuvable | MGE — Électricien Paris">
    <meta property="og:image" content="https://mongegauthierenergie.github.io/images/og-mge.jpg">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <link rel="preload" href="fonts/Inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/CormorantGaramond-300-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: #0d1620;
            color: #f0ebe3;
        }
        .not-found-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 300;
            line-height: 1;
            color: rgba(255,255,255,0.08);
            margin-bottom: 1rem;
        }
        .not-found h1 {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #f0ebe3;
        }
        .not-found p {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(240,235,227,0.55);
            max-width: 400px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }
        .not-found-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-main {
            display: inline-block;
            padding: 0.85rem 2rem;
            background: #f0ebe3;
            color: #0d1620;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-main:hover { opacity: 0.85; }
        .btn-ghost {
            display: inline-block;
            padding: 0.85rem 2rem;
            border: 1px solid rgba(240,235,227,0.25);
            color: #f0ebe3;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            transition: border-color 0.2s;
        }
        .btn-ghost:hover { border-color: rgba(240,235,227,0.6); }
        .not-found-logo {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
        }
        .not-found-logo img { height: 36px; }
    </style>
</head>
<body>
    <div class="not-found">
        <a href="/" class="not-found-logo">
            <img src="images/logo-mge.png" alt="MGE">
        </a>
        <div class="lang-switch not-found-lang">
            <button class="lang-btn active" data-lang="fr" onclick="switchLang('fr')">FR</button>
            <span class="lang-sep">/</span>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
        <div class="not-found-code">404</div>
        <h1 data-i18n="t.h1">Page introuvable</h1>
        <p data-i18n="t.p">Cette page n'existe pas ou a été déplacée. Revenez à l'accueil pour découvrir nos services.</p>
        <div class="not-found-links">
            <a href="/" class="btn-main" data-i18n="t.home">Retour à l'accueil</a>
            <a href="/#contact" class="btn-ghost" data-i18n="t.contact">Nous contacter</a>
        </div>
        <p class="not-found-legal">
            <a href="mentions-legales.html" data-i18n="t.legal1">Mentions légales</a> ·
            <a href="confidentialite.html" data-i18n="t.legal2">Confidentialité</a> ·
            <a href="cgu.html" data-i18n="t.legal3">CGU</a>
        </p>
    </div>
    <script>
        const traductions = {
            fr: {
                't.title':   'Page introuvable | MGE — Électricien Paris',
                't.h1':      'Page introuvable',
                't.p':       "Cette page n'existe pas ou a été déplacée. Revenez à l'accueil pour découvrir nos services.",
                't.home':    "Retour à l'accueil",
                't.contact': 'Nous contacter',
                't.legal1':  'Mentions légales',
                't.legal2':  'Confidentialité',
                't.legal3':  'CGU'
            },
            en: {
                't.title':   'Page not found | MGE — Electrician in Paris',
                't.h1':      'Page not found',
                't.p':       'This page does not exist or has been moved. Head back to the home page to explore our services.',
                't.home':    'Back to home',
                't.contact': 'Get in touch',
                't.legal1':  'Legal notice',
                't.legal2':  'Privacy',
                't.legal3':  'Terms of use'
            }
        };

        let currentLang = (() => {
            try { return localStorage.getItem('mge-lang') || 'fr'; } catch { return 'fr'; }
        })();

        function applyLang(lang) {
            currentLang = lang;
            try { localStorage.setItem('mge-lang', lang); } catch { /* navigation privée */ }
            const t = traductions[lang];
            document.documentElement.lang = lang;
            document.title = t['t.title'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const v = t[el.dataset.i18n];
                if (v !== undefined) el.textContent = v;
            });
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
        }
        function switchLang(lang) { if (lang !== currentLang) applyLang(lang); }
        applyLang(currentLang);
    </script>
    <script src="consent.js" defer></script>
</body>
</html>
